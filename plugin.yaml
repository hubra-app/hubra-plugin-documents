id: documents
name: Documents
version: "1.2.0"
hubra: ">=0.2.6,<1"
description: "Document library: folders, uploads and access per role or group. Files are stored encrypted in Hubra's file store."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-documents
license: AGPL-3.0-or-later
tags: [documents, files, folders]
package: hubra_documents
modules: [documents]
requires: [members]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, jobs, nav, frontend, contracts]
